<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Занятие 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>2D преобразования</h1>

    <div class="layout">
        <div class="controls">
            <fieldset>
                <legend>Исходный многоугольник</legend>
                <div id="vertices-inputs"></div>
            </fieldset>

            <fieldset>
                <legend>Перенос</legend>
                <label>tx: <input type="number" id="tx" value="0" step="1"></label>
                <label>ty: <input type="number" id="ty" value="0" step="1"></label>
            </fieldset>

            <fieldset>
                <legend>Масштаб</legend>
                <label>sx: <input type="number" id="sx" value="1" step="0.1"></label>
                <label>sy: <input type="number" id="sy" value="1" step="0.1"></label>
            </fieldset>

            <fieldset>
                <legend>Поворот</legend>
                <label>угол (в градусах): <input type="number" id="angle" value="0" step="1"></label>
            </fieldset>

            <fieldset>
                <legend>Центр</legend>
                <label>cx: <input type="number" id="cx" value="20" step="1"></label>
                <label>cy: <input type="number" id="cy" value="15" step="1"></label>
            </fieldset>

            <fieldset>
                <legend>Порядок операций</legend>
                <label>
                    <input type="radio" name="order" value="TR" checked>
                    A: сначала повернуть, потом перенести
                </label>
                <label>
                    <input type="radio" name="order" value="RT">
                    B: сначала перенести, потом повернуть
                </label>
            </fieldset>

            <div class="buttons">
                <button id="btn-apply">Применить</button>
                <button id="btn-reset">Сброс</button>
            </div>
        </div>

        <div class="canvas-wrap">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <h2>Итоговая матрица</h2>
    <pre id="matrix-output"></pre>

    <h2>Вершины</h2>
    <table id="vertices-table">
        <thead>
            <tr>
                <th>Вершина</th>
                <th>x исходный</th>
                <th>y исходный</th>
                <th>x новый</th>
                <th>y новый</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="app.js"></script>
</body>
</html>
