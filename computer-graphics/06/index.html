<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Занятие 6</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Отсечение многоугольника алгоритмом Сазерленд–Ходжмана</h1>

  <div class="controls">
    <button id="button-reset">Сбросить</button>
    
    <span class="divider"></span>
    
    <label>Окно:</label>
    <label>xmin: <input type="number" id="xmin" value="10" min="0" max="39"></label>
    <label>xmax: <input type="number" id="xmax" value="30" min="0" max="39"></label>
    <label>ymin: <input type="number" id="ymin" value="5"  min="0" max="29"></label>
    <label>ymax: <input type="number" id="ymax" value="20" min="0" max="29"></label>
    
    <span class="divider"></span>

    <label>Показать этап:
      <select id="stage-select">
        <option value="original">Исходный</option>
        <option value="left">После LEFT</option>
        <option value="right">После RIGHT</option>
        <option value="top">После TOP</option>
        <option value="bottom">После BOTTOM</option>
      </select>
    </label>
  </div>

  <canvas id="canvas"></canvas>

  <h2>Промежуточные результаты</h2>
  <table id="results-table">
    <thead>
      <tr>
        <th>Этап</th>
        <th>Число вершин</th>
        <th>Координаты</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
