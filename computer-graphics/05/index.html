<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Занятие 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Заполнение областей</h1>

    <div class="controls">
        <button id="button-clear">Очистить</button>
        
        <label>Шагов Flood Fill:
            <input type="range" id="flood-step" min="0" max="100" value="100" disabled>
            <span id="flood-step-label"></span>
        </label>
    </div>

    <canvas id="canvas"></canvas>

    <h2>Scanline Fill</h2>
    <div class="controls">
        <label>y = <input type="number" id="scan-y" value="15" min="0" max="30"></label>
        <button id="button-scanline">Scanline Fill</button>
    </div>

    <pre id="scan-info">Нажмите «Scanline Fill»</pre>

    <div class="controls">
        <button id="button-compare">Сравнение</button>
    </div>
    <pre id="compare-info"></pre>

    <script src="app.js"></script>
</body>
</html>
