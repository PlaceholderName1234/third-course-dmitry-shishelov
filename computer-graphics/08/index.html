<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Занятие 8</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>Основы 3D-графики</h1>

	<div class="layout">
		<div class="controls">
			<fieldset>
				<legend>Модель</legend>
				<select id="model-select">
					<option value="cube">Куб</option>
					<option value="pyramid">Пирамида</option>
				</select>
			</fieldset>

			<fieldset>
				<legend>Поворот (в градусах)</legend>
				<label>X: <input type="number" id="rot-x" value="0" step="1"></label>
				<label>Y: <input type="number" id="rot-y" value="0" step="1"></label>
				<label>Z: <input type="number" id="rot-z" value="0" step="1"></label>
			</fieldset>

			<fieldset>
				<legend>Масштаб и камера</legend>
				<label>scale: <input type="number" id="scale" value="1" step="1"></label>
				<label>Расстояние: <input type="number" id="tz" value="5" step="1"></label>
			</fieldset>

			<fieldset>
				<legend>Проекция</legend>
				<label>
					<input type="radio" name="projection" value="ortho" checked> Ортографическая
				</label>
				<label>
					<input type="radio" name="projection" value="perspective"> Перспективная
				</label>
				<label>f: <input type="number" id="focal" value="300" step="10"></label>
			</fieldset>

			<div class="buttons">
				<button id="btn-toggle-anim">Пауза</button>
				<button id="btn-reset">Сброс</button>
			</div>
		</div>

		<div class="canvas-wrap">
			<canvas id="canvas" width="600" height="500"></canvas>
		</div>
	</div>

	<h2>Матрица модели</h2>
	<pre id="matrix-output"></pre>

	<h2>Вершина (1, 1, 1)</h2>
	<table id="vertex-table">
		<thead>
			<tr>
				<th>Состояние</th>
				<th>x</th>
				<th>y</th>
				<th>z</th>
			</tr>
		</thead>
		<tbody>
			<tr><td>До преобразования</td><td id="vx0">—</td><td id="vy0">—</td><td id="vz0">—</td></tr>
			<tr><td>После модели</td><td id="vx1">—</td><td id="vy1">—</td><td id="vz1">—</td></tr>
		</tbody>
	</table>

	<h2>Экранные координаты</h2>
	<pre id="screen-output">—</pre>

	<script src="app.js"></script>
</body>
</html>
