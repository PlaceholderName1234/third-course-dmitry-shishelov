<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счетчик</title>
    <link rel="stylesheet" href="style.css">
  </head>
  
  <body>
    <div class="container">
      <h1>Счётчик</h1>
      
      <div id="value-display" class="value">0</div>
      
      <div id="status-message" class="status"></div>

      <div class="buttons">
        <button id="button-increment">+1</button>
        <button id="button-decrement">-1</button>
        <button id="button-reset">Сброс</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
